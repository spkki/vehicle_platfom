{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="mb-4"><i class="bi bi-fuel-pump me-2"></i>Add Fuel Log</h2>
                <form method="POST" action="{{ url_for('add_fuel_log', vehicle_id=vehicle.id if vehicle else 0) }}">
                    <div class="mb-3">
                        <label for="vehicle_id" class="form-label">Vehicle <span class="text-danger">*</span></label>
                        <select class="form-select" id="vehicle_id" name="vehicle_id" required>
                            <option value="">-- Select Vehicle --</option>
                            {% for v in vehicles %}
                            <option value="{{ v.id }}" {% if vehicle and v.id == vehicle.id %}selected{% endif %}>
                                {{ v.make }} {{ v.model }} ({{ v.nickname or v.year }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    <div class="mb-3">
                        <label for="odometer" class="form-label">Odometer (km) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="odometer" name="odometer" min="0" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label for="liter" class="form-label">Liters <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="liter" name="liter" min="0" required>
                        </div>
                        <div class="col-6">
                            <label for="price_per_liter" class="form-label">Price/Liter (DKK) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="price_per_liter" name="price_per_liter" min="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="total_cost" class="form-label">Total Cost (DKK) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control" id="total_cost" name="total_cost" min="0" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="full_tank" name="full_tank">
                        <label class="form-check-label" for="full_tank">Full tank?</label>
                    </div>
                    <div class="mb-4">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Additional notes..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent">
                            <i class="bi bi-check-lg me-1"></i>Add Fuel Log
                        </button>
                        <a href="{{ url_for('fuel_logs', vehicle_id=vehicle.id if vehicle else 1) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_scripts %}
<script>
    // Auto-calculate total cost
    const literInput = document.getElementById('liter');
    const priceInput = document.getElementById('price_per_liter');
    const totalInput = document.getElementById('total_cost');

    function calcTotal() {
        const liters = parseFloat(literInput.value) || 0;
        const price = parseFloat(priceInput.value) || 0;
        if (liters && price) {
            totalInput.value = (liters * price).toFixed(2);
        }
    }
    literInput.addEventListener('input', calcTotal);
    priceInput.addEventListener('input', calcTotal);
</script>
{% endblock %}

{% endblock %}
